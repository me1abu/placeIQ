# Render Blueprint: one free web service built from the Dockerfile.
# Render reads this file when you choose "New → Blueprint" and pick this repository.
services:
  - type: web
    name: placeiq
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/engine/health
    envVars:
      # The placement-cell password. You type it in the Render dashboard; it never goes in git.
      - key: PLACEIQ_ADMIN_PASSWORD
        sync: false
      # Secret for hashing roll numbers. Render generates a random value once and keeps it.
      - key: PLACEIQ_SALT
        generateValue: true
      # Signs sign-in cookies (students and placement cell). Generated once by Render.
      - key: PLACEIQ_SESSION_SECRET
        generateValue: true
      # External PostgreSQL (e.g. Neon free). Without it, student accounts are wiped on every restart.
      - key: DATABASE_URL
        sync: false
      # The free plan is too small to retrain online; the model built into the image is used.
      - key: PLACEIQ_DISABLE_TRAINING
        value: "1"
